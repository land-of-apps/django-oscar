appmap_dir: tmp/appmap
language: python
name: django-oscar_nov_2025
packages:
  - path: sandbox
  - path: haystack.generic_views  # Track view handling
  - path: haystack.query  # Track SearchQuerySet operations and facet_counts()
  - path: haystack.models  # Track SearchResult object access
    exclude:
      - SearchResult._get_log  # Very noisy
  - path: haystack.backends.whoosh_backend  # Track Whoosh backend operations
    exclude:
      - WhooshSearchBackend._to_python  # Very noisy
  - path: oscar
    exclude:
      - apps.catalogue.abstract_models.AbstractCategory.get_ancestors_and_self
  - path: oscar.apps.search  # Oscar's search extensions
  - path: oscar.templatetags.product_tags  # Track render_product tag if rendering is slow
  - path: oscar.apps.partner.strategy  # Track select_stockrecord calls
